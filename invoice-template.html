<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قالب فاتورة - Invoice Template</title>
<style>
  body{margin:0; background:#eef1f4; padding:18px 0 40px;}
  .page-card{
    max-width:820px;
    margin:0 auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 14px rgba(22,50,79,.12);
    overflow:hidden;
  }
  @media print{
    body{padding:0;}
    .page-card{box-shadow:none; border-radius:0;}
  }
  :root{
    --ink:#16324f;
    --ink-soft:#3f5872;
    --line:#c9d6e3;
    --paper:#ffffff;
    --accent:#16324f;
    --highlight:#fff3b0;
    --muted:#7c8ea1;
  }
  *{box-sizing:border-box;}
  .inv-wrap{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:var(--paper);
    max-width:820px;
    margin:0 auto;
    padding:28px 22px 60px;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
  }
  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn.secondary{
    background:#fff;
    color:var(--ink);
  }
  .btn.danger{
    background:#fff;
    color:#b03030;
    border-color:#e0b3b3;
  }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .co-name{
    font-size:20px;
    font-weight:800;
    letter-spacing:.2px;
    outline:none;
    border:none;
    background:transparent;
    color:var(--ink);
    width:100%;
    padding:2px 0;
  }
  .co-line{
    font-size:12.5px;
    color:var(--ink-soft);
    outline:none;
    border:none;
    background:transparent;
    width:100%;
    padding:1px 0;
  }
  .logo-box{
    width:78px;height:78px;
    border-radius:50%;
    border:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:var(--muted);
    text-align:center;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
    cursor:pointer;
  }
  .logo-box img{width:100%;height:100%;object-fit:cover;}
  .logo-input{display:none;}
  .title-row{
    text-align:center;
    margin-bottom:18px;
  }
  .title-row .doc-title{
    font-size:22px;
    font-weight:800;
    color:var(--accent);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .title-row .doc-date{
    margin-top:4px;
    font-size:14px;
    color:var(--ink-soft);
    outline:none;
    border:none;
    background:transparent;
    text-align:center;
    font-weight:600;
  }
  .meta{
    margin-bottom:20px;
    font-size:14px;
    line-height:1.9;
  }
  .meta-row{
    display:flex;
    gap:8px;
    align-items:baseline;
    flex-wrap:wrap;
  }
  .meta-row label{
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
    font-size:13.5px;
  }
  .meta-row input, .meta-row textarea{
    flex:1;
    min-width:180px;
    border:none;
    border-bottom:1px solid transparent;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:transparent;
    padding:2px 4px;
    resize:none;
  }
  .meta-row input:focus, .meta-row textarea:focus{border-bottom:1px solid var(--line);}
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:6px;
    font-size:14px;
  }
  thead th{
    background:var(--accent);
    color:#fff;
    text-align:left;
    padding:10px 10px;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  thead th.num, tbody td.num{text-align:right;}
  tbody td{
    border-bottom:1px solid var(--line);
    padding:8px 10px;
    vertical-align:middle;
  }
  tbody input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    padding:2px;
  }
  tbody input.num{text-align:right;}
  .subtotal-cell{
    text-align:right;
    font-weight:600;
    white-space:nowrap;
  }
  .row-del{
    background:none;
    border:none;
    color:#b03030;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 6px;
  }
  .add-row-btn{
    margin:10px 0 22px;
    font-size:13px;
    padding:7px 14px;
  }
  .totals{
    width:100%;
    max-width:340px;
    margin-left:auto;
    font-size:14px;
  }
  .totals-row{
    display:flex;
    justify-content:space-between;
    padding:7px 10px;
    border-bottom:1px solid var(--line);
  }
  .totals-row label{color:var(--ink-soft); font-weight:600;}
  .totals-row .val{font-weight:600;}
  .totals-row.vat-rate input{
    width:44px;
    border:none;
    border-bottom:1px solid var(--line);
    text-align:center;
    outline:none;
    font-size:13px;
    font-family:inherit;
  }
  .totals-row.grand{
    background:var(--accent);
    color:#fff;
    border-radius:6px;
    border:none;
    font-size:16px;
    margin-top:6px;
    padding:10px 12px;
  }
  .totals-row.grand .val{
    background:var(--highlight);
    color:var(--ink);
    padding:2px 10px;
    border-radius:4px;
  }
  .footer-note{
    margin-top:34px;
    text-align:right;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .footer-note input{
    text-align:right;
    border:none;
    outline:none;
    background:transparent;
    font-size:12.5px;
    color:var(--ink-soft);
    width:100%;
    font-family:inherit;
    padding:1px 0;
  }
  .curr-select{
    font-size:12px;
    border:1px solid var(--line);
    border-radius:5px;
    padding:4px 6px;
    background:#fff;
    color:var(--ink);
  }

  @media (max-width:600px){
    .inv-wrap{padding:16px 10px 50px;}
    table, thead, tbody, tr, th, td{display:block;}
    thead{display:none;}
    tbody tr{
      border:1px solid var(--line);
      border-radius:8px;
      margin-bottom:10px;
      padding:8px 10px;
      position:relative;
    }
    tbody td{border:none; padding:4px 2px;}
    tbody td::before{
      content:attr(data-label);
      display:block;
      font-size:10.5px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
      margin-bottom:2px;
    }
    .row-del{position:absolute; top:6px; left:6px;}
  }

  @media print{
    .toolbar, .row-del, .add-row-btn, .logo-box{ -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .toolbar, .add-row-btn{display:none !important;}
    body{background:#fff;}
    .inv-wrap{max-width:100%; padding:0;}
    .logo-box{border:none;}
    thead th{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .totals-row.grand{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div class="page-card">
<div class="inv-wrap" id="invoice">
  <div class="toolbar">
    <button class="btn" type="button" data-action="print">⬇ تصدير PDF / طباعة</button>
    <button class="btn secondary" type="button" data-action="add-row">+ إضافة صنف</button>
    <button class="btn secondary" type="button" data-action="reset">تصفير الكميات</button>
  </div>

  <div class="top">
    <div style="flex:1;">
      <input class="co-name" value="" placeholder="اسم الشركة">
      <input class="co-line" value="" placeholder="MOF">
      <input class="co-line" value="" placeholder="رقم VAT">
    </div>
    <div class="logo-box" id="logoBox">
      الشعار
    </div>
  </div>

  <div class="title-row">
    <div class="doc-title">فاتورة / Invoice</div>
    <input class="doc-date" type="text" value="" placeholder="التاريخ">
  </div>

  <div class="meta">
    <div class="meta-row"><label>رقم الفاتورة:</label><input type="text" value="" placeholder=""></div>
    <div class="meta-row"><label>Invoice to:</label><input type="text" value="" placeholder=""></div>
    <div class="meta-row"><label>Location:</label><textarea rows="1" placeholder=""></textarea></div>
    <div class="meta-row"><label>MOF:</label><input type="text" value="" placeholder=""></div>
    <div class="meta-row"><label>Phone:</label><input type="text" value="" placeholder=""></div>
  </div>

  <table id="itemsTable">
    <thead>
      <tr>
        <th style="width:34px;"></th>
        <th>الصنف / Item</th>
        <th class="num" style="width:110px;">سعر الوحدة</th>
        <th class="num" style="width:70px;">الكمية</th>
        <th class="num" style="width:110px;">المجموع</th>
      </tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <button class="btn secondary add-row-btn" type="button" data-action="add-row">+ إضافة صنف</button>

  <div class="totals">
    <div class="totals-row">
      <label>TOTAL VATABLE</label>
      <span class="val" id="subtotalVal">0.000</span>
    </div>
    <div class="totals-row vat-rate">
      <label>VAT <input type="number" id="vatRate" value="11" min="0" step="0.1">%</label>
      <span class="val" id="vatVal">0.000</span>
    </div>
    <div class="totals-row grand">
      <label>Grand Total</label>
      <span class="val" id="grandVal">0.000</span>
    </div>
  </div>

  <div class="footer-note">
    <input type="text" value="" placeholder="اسم الشركة">
    <input type="text" value="" placeholder="العنوان">
    <input type="text" value="" placeholder="رقم الهاتف">
  </div>
</div>
</div>

<script>
  const seedItems = [
    ["", "", ""],
  ];

  const body = document.getElementById('itemsBody');

  function rowTemplate(name="", price="", qty=""){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-label=""><button class="row-del" type="button" data-action="del-row">✕</button></td>
      <td data-label="الصنف"><input type="text" class="item-name" value="${name}" placeholder="اسم الصنف"></td>
      <td data-label="سعر الوحدة" class="num"><input type="number" step="0.001" inputmode="decimal" class="num item-price" value="${price}"></td>
      <td data-label="الكمية" class="num"><input type="number" step="1" inputmode="decimal" class="num item-qty" value="${qty}"></td>
      <td data-label="المجموع" class="subtotal-cell item-sub">0.000</td>
    `;
    return tr;
  }

  function addRow(name, price, qty){
    body.appendChild(rowTemplate(name||"", price!==undefined?price:"", qty!==undefined?qty:""));
    recalc();
  }

  function delRow(btn){
    btn.closest('tr').remove();
    recalc();
  }

  function resetAmounts(){
    document.querySelectorAll('.item-qty').forEach(i => i.value = 0);
    recalc();
  }

  function fmt(n){
    return n.toLocaleString('en-US', {minimumFractionDigits:3, maximumFractionDigits:3});
  }

  function recalc(){
    let subtotal = 0;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
      const price = parseFloat(tr.querySelector('.item-price').value) || 0;
      const qty = parseFloat(tr.querySelector('.item-qty').value) || 0;
      const sub = price * qty;
      tr.querySelector('.item-sub').textContent = fmt(sub);
      subtotal += sub;
    });
    const vatRate = parseFloat(document.getElementById('vatRate').value) || 0;
    const vat = subtotal * (vatRate/100);
    const grand = subtotal + vat;
    document.getElementById('subtotalVal').textContent = fmt(subtotal);
    document.getElementById('vatVal').textContent = fmt(vat);
    document.getElementById('grandVal').textContent = fmt(grand);
  }

  document.getElementById('vatRate').addEventListener('input', recalc);

  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.getAttribute('data-action');
    if(action === 'print'){ window.print(); }
    else if(action === 'add-row'){ addRow(); }
    else if(action === 'reset'){ resetAmounts(); }
    else if(action === 'del-row'){ delRow(btn); }
  });

  document.addEventListener('input', function(e){
    if(e.target.classList.contains('item-price') || e.target.classList.contains('item-qty')){
      recalc();
    }
  });

  seedItems.forEach(([n,p,q]) => addRow(n,p,q));
  recalc();
</script>
</body>
</html>
